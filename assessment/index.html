<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 생각 노트 · 루미 모자이크</title><link rel="icon" href="../assets/round.png"><link rel="stylesheet" href="../theme/fonts.css"><link rel="stylesheet" href="../style.css"></head><body><header><div><a class="home" href="https://math-game-arcade.vercel.app/">수학 아틀리에 ↗</a><h1>루미 모자이크 <small>나의 생각 노트</small></h1></div><a href="../?tutorial=off">온실로 돌아가기</a></header><main><nav class="note-nav" id="tasks" aria-label="새로운 자료 선택"></nav><section class="note-panel"><h2 id="title"></h2><p id="prompt"></p><div id="data"></div><div id="graph"></div><form id="answer-form"><div id="inputs" class="entry-fields"></div><label for="explanation">어떻게 생각했나요?</label><textarea id="explanation" placeholder="전체와 부분을 어떻게 비교했는지 적어 보세요."></textarea><div class="note-controls"><button type="button" id="help">힌트 보기</button><button type="submit">생각 남기기</button><button type="button" id="retry">다시 해보기</button></div></form><p class="feedback" id="feedback" role="status">새 자료로 내 생각을 확인해 보세요.</p></section><section class="note-panel"><h2>내가 남긴 생각</h2><div id="report"></div><details><summary>시도 기록 보기</summary><div id="history"></div></details><label for="review">함께 읽고 남기는 피드백</label><textarea id="review" placeholder="설명에서 잘 드러난 생각과 다시 살펴볼 점"></textarea><div class="note-controls"><button id="save-review">피드백 저장</button><button id="print">기록 인쇄</button></div><p id="review-status" role="status"></p></section></main><script type="module" src="app.mjs"></script></body></html>
